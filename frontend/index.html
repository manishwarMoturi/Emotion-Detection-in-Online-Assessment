<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Emotion Detection Coding Platform</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 2rem;
            background-color: var(--background-paper);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .login-container h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--primary-color);
        }

        .role-selector {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .role-btn {
            padding: 0.75rem 1.5rem;
            border: 1px solid var(--primary-color);
            border-radius: 4px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .role-btn:hover {
            background-color: rgba(156, 39, 176, 0.1);
            color: var(--text-primary);
        }

        .role-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s ease;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            background-color: #7b1fa2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <h1>Emotion Detection Coding Platform</h1>
            <div class="role-selector">
                <button class="role-btn active" data-role="student">Student</button>
                <button class="role-btn" data-role="testtaker">Test Taker</button>
                <button class="role-btn" data-role="admin">Admin</button>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="submit-btn">Sign In</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const roleButtons = document.querySelectorAll('.role-btn');
            let selectedRole = 'student';

            // Role selection handling
            roleButtons.forEach(button => {
                button.addEventListener('click', () => {
                    roleButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    selectedRole = button.getAttribute('data-role');
                });
            });

            // Form submission handling
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                // In a real application, you would validate credentials here
                // For demo purposes, we'll just redirect to the appropriate dashboard
                switch(selectedRole) {
                    case 'student':
                        window.location.href = 'student-dashboard.html';
                        break;
                    case 'testtaker':
                        window.location.href = 'testtaker-dashboard.html';
                        break;
                    case 'admin':
                        window.location.href = 'admin-dashboard.html';
                        break;
                }
            });
        });
    </script>
</body>
</html>
