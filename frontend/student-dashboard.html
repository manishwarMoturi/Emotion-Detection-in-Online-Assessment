<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Emotion Detection Coding Platform</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/dashboard.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Emotion Detection Coding Platform</div>
        <div class="nav-links">
            <a href="student-dashboard.html" class="active">Dashboard</a>
            <a href="practice.html">Practice</a>
            <a href="exams.html">Exams</a>
            <a href="profile.html">Profile</a>
            <a href="index.html" class="logout-btn">Logout</a>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="tabs">
            <button class="tab-btn active" data-tab="practice">Practice Problems</button>
            <button class="tab-btn" data-tab="exams">Upcoming Exams</button>
        </div>

        <div class="tab-content active" id="practice-content">
            <div class="problems-grid">
                <!-- Practice Problems -->
                <div class="problem-card">
                    <div class="problem-header">
                        <h3>Two Sum</h3>
                        <span class="difficulty easy">Easy</span>
                    </div>
                    <p class="problem-description">Find two numbers that add up to a target value.</p>
                    <div class="problem-footer">
                        <button class="start-btn" onclick="location.href='practice.html?id=1'">Start Practice</button>
                    </div>
                </div>

                <div class="problem-card">
                    <div class="problem-header">
                        <h3>Valid Parentheses</h3>
                        <span class="difficulty medium">Medium</span>
                    </div>
                    <p class="problem-description">Check if the input string has valid parentheses.</p>
                    <div class="problem-footer">
                        <button class="start-btn" onclick="location.href='practice.html?id=2'">Start Practice</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-content" id="exams-content">
            <div class="exams-grid">
                <!-- Upcoming Exams -->
                <div class="exam-card">
                    <div class="exam-header">
                        <h3>Data Structures Final</h3>
                        <span class="exam-date">March 20, 2024</span>
                    </div>
                    <div class="exam-details">
                        <p><strong>Duration:</strong> 2 hours</p>
                        <p><strong>Questions:</strong> 5</p>
                    </div>
                    <div class="exam-footer">
                        <button class="view-btn" onclick="location.href='exam-details.html?id=1'">View Details</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts/dashboard.js"></script>
</body>
</html>
