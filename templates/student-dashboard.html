<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Emotion Detection Coding Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/dashboard.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Emotion Detection Coding Platform</div>
        <div class="nav-links">
            <a href="{{ url_for('student_dashboard') }}" class="active">Dashboard</a>
            <a href="#">Practice</a>
            <a href="{{ url_for('exams') }}">Exams</a>
            <a href="{{ url_for('profile') }}">Profile</a>
            <a href="{{ url_for('index') }}" class="logout-btn">Logout</a>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="tabs">
            <button class="tab-btn active" data-tab="practice">Practice Problems</button>
            <button class="tab-btn" data-tab="exams">Upcoming Exams</button>
        </div>

        <div class="tab-content active" id="practice-content">
            <div class="problems-grid">
                <!-- Practice Problems -->
                {% for problem in problems %}
                <div class="problem-card">
                    <div class="problem-header">
                        <h3>{{ problem.title }}</h3>
                        <span class="difficulty {{ problem.difficulty }}">{{ problem.difficulty|capitalize }}</span>
                    </div>
                    <p class="problem-description">{{ problem.description }}</p>
                    <div class="problem-footer">
                        <button class="start-btn" onclick="location.href='{{ url_for('practice', problem_id=problem._id) }}'">Start Practice</button>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>

        <div class="tab-content" id="exams-content">
            <div class="exams-grid">
                <!-- Upcoming Exams -->
                <div class="exam-card">
                    <div class="exam-header">
                        <h3>Data Structures Final</h3>
                        <span class="exam-date">March 20, 2024</span>
                    </div>
                    <div class="exam-details">
                        <p><strong>Duration:</strong> 2 hours</p>
                        <p><strong>Questions:</strong> 5</p>
                    </div>
                    <div class="exam-footer">
                        <button class="view-btn" onclick="location.href='{{ url_for('exam_details', exam_id=1) }}'">View Details</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='scripts/dashboard.js') }}"></script>
</body>
</html>
