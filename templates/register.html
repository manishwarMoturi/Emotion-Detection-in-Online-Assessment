<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Emotion Detection Coding Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
    <style>
        .register-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 2rem;
            background-color: var(--background-paper);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .register-container h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--primary-color);
        }

        .role-selector {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .role-btn {
            padding: 0.75rem 1.5rem;
            border: 1px solid var(--primary-color);
            border-radius: 4px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .role-btn:hover {
            background-color: rgba(156, 39, 176, 0.1);
            color: var(--text-primary);
        }

        .role-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .register-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s ease;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            background-color: #7b1fa2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="register-container">
            <h1>Create Account</h1>
            <div class="role-selector">
                <button class="role-btn active" data-role="student">Student</button>
                <button class="role-btn" data-role="testtaker">Test Taker</button>
                <button class="role-btn" data-role="admin">Admin</button>
            </div>
            <form id="registerForm" class="register-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>
                <button type="submit" class="submit-btn">Register</button>
                <div class="login-link" style="text-align: center; margin-top: 1rem;">
                    Already have an account? <a href="{{ url_for('index') }}" style="color: var(--primary-color); text-decoration: none;">Login</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const roleButtons = document.querySelectorAll('.role-btn');
            let selectedRole = 'student';

            // Role selection handling
            roleButtons.forEach(button => {
                button.addEventListener('click', () => {
                    roleButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    selectedRole = button.getAttribute('data-role');
                });
            });

            // Form submission handling
            document.getElementById('registerForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                // Validate passwords match
                if (password !== confirmPassword) {
                    alert('Passwords do not match!');
                    return;
                }

                // Show loading state
                const submitButton = document.querySelector('.submit-btn');
                const originalButtonText = submitButton.textContent;
                submitButton.textContent = 'Registering...';
                submitButton.disabled = true;

                // Clear any previous error messages
                const errorContainer = document.getElementById('error-message');
                if (errorContainer) {
                    errorContainer.style.display = 'none';
                }

                // Call the register API
                fetch('{{ url_for("register_user") }}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        role: selectedRole
                    }),
                })
                .then(response => response.json())
                .then(data => {
                    // Reset button state
                    submitButton.textContent = originalButtonText;
                    submitButton.disabled = false;

                    if (data.status === 'success') {
                        // Successful registration - redirect to login
                        window.location.href = '{{ url_for("index") }}';
                    } else {
                        // Show error message
                        if (!errorContainer) {
                            const newErrorContainer = document.createElement('div');
                            newErrorContainer.id = 'error-message';
                            newErrorContainer.className = 'error-message';
                            newErrorContainer.style.color = 'red';
                            newErrorContainer.style.marginTop = '1rem';
                            newErrorContainer.style.textAlign = 'center';
                            document.getElementById('registerForm').appendChild(newErrorContainer);
                            
                            // Display error message
                            newErrorContainer.textContent = data.message || 'Registration failed. Please try again.';
                            newErrorContainer.style.display = 'block';
                        } else {
                            errorContainer.textContent = data.message || 'Registration failed. Please try again.';
                            errorContainer.style.display = 'block';
                        }
                    }
                })
                .catch(error => {
                    // Reset button state
                    submitButton.textContent = originalButtonText;
                    submitButton.disabled = false;

                    // Show error message
                    if (!errorContainer) {
                        const newErrorContainer = document.createElement('div');
                        newErrorContainer.id = 'error-message';
                        newErrorContainer.className = 'error-message';
                        newErrorContainer.style.color = 'red';
                        newErrorContainer.style.marginTop = '1rem';
                        newErrorContainer.style.textAlign = 'center';
                        document.getElementById('registerForm').appendChild(newErrorContainer);
                    }
                    
                    errorContainer.textContent = 'An error occurred. Please try again later.';
                    errorContainer.style.display = 'block';
                    console.error('Error:', error);
                });
            });
        });
    </script>
</body>
</html>
